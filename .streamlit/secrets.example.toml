# SWAYAMYAN — Streamlit Community Cloud Secrets Template
# Copy these values into your Streamlit Cloud app settings:
# App Dashboard -> Manage App -> Settings -> Secrets
#
# IMPORTANT: DO NOT commit your actual secrets.toml or real private keys to GitHub!

# Google Cloud Project ID with Earth Engine API enabled
EE_PROJECT_ID = "your-earth-engine-cloud-project-id"

# Dedicated Google Cloud Service Account Credentials
# Create a Service Account in GCP IAM with the 'Earth Engine Resource Viewer'
# or 'Earth Engine Resource User' role, generate a JSON key, and paste the fields:
[EARTH_ENGINE_SERVICE_ACCOUNT]
type = "service_account"
project_id = "your-earth-engine-cloud-project-id"
private_key_id = "your-private-key-id"
private_key = "-----BEGIN PRIVATE KEY-----\nMIIEvgIBADANBgkqhkiG9w0BAQEFAASCBKgwggSkAgEAAoIBAQC...\n-----END PRIVATE KEY-----\n"
client_email = "swayamyan-ee-sa@your-project-id.iam.gserviceaccount.com"
client_id = "123456789012345678901"
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "https://www.googleapis.com/robot/v1/metadata/x509/swayamyan-ee-sa%40your-project-id.iam.gserviceaccount.com"

# Alternatively, you can store the entire service account JSON as a single-line string:
# EE_SERVICE_ACCOUNT_JSON = '{"type": "service_account", "project_id": "...", ...}'
